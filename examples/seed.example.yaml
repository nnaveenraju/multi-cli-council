  - "https://blog.langchain.dev/memory-for-ai-agents/"

goals:
  - "Survey competing memory designs and their failure modes"
  - "Argue for a hybrid memory thesis with concrete open problems"
  - "Academic tone suitable for a workshop short paper"

constraints:
  - "Prefer sources from 2020 onward"
  - "Do not invent citations"
