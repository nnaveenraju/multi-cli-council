title: "Agent memory architectures for long-horizon LLM agents"

main_points:
  - "Long-horizon agents fail when context windows fill; external memory is necessary."
  - "Vector memory alone is insufficient for multi-step plans with branching state."
  - "A hybrid of episodic + structured state memory may improve reliability."

seed_links:
