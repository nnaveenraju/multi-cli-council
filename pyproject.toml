[project]
name = "multi-cli-council"
version = "0.1.0"
description = "Multi-CLI LLM Council for research paper research, critique, and finalization (inspired by Andrej Karpathy's LLM Council)"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Naveen Nadimpalli" },
]
keywords = ["llm", "multi-agent", "council", "cli", "research", "critique"]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "pyyaml>=6.0.2",
    "rich>=13.9.0",
    "typer>=0.12.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.12",
    "jinja2>=3.1.4",
    "python-docx>=1.1.2",
    "pillow>=10.0.0",
]

[project.urls]
Homepage = "https://github.com/nnaveenraju/multi-cli-council"
Repository = "https://github.com/nnaveenraju/multi-cli-council"
Issues = "https://github.com/nnaveenraju/multi-cli-council/issues"
Changelog = "https://github.com/nnaveenraju/multi-cli-council/releases"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[project.scripts]
council = "council.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/council"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.hatch.build.targets.wheel.force-include]
# NOTE: src/council/web ships via `packages` above — do not force-include it
# here or hatchling fails with a duplicate-path error.
"prompts" = "prompts"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
